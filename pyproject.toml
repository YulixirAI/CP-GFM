[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cp-gfm-public"
version = "0.1.0"
description = "Public scientific interface of CP-GFM: architecture, data contracts, and a synthetic toy runtime."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "See LICENSE-or-NOTICE.md — license pending final legal review." }
authors = [{ name = "CP-GFM Contributors" }]
keywords = ["cyclic peptide", "generative model", "multi-objective optimization", "topology"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "jsonschema>=4.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["cp_gfm_public"]

[tool.pytest.ini_options]
testpaths = ["tests"]
